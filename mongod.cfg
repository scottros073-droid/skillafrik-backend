# MongoDB Configuration File
# Location: backend/mongod.cfg
# Purpose: Development MongoDB server configuration

# Network and Server Settings
net:
  bindIp: development-host
  port: 27017

# Storage Engine Settings
storage:
  dbPath: ./data/db
  journal:
    enabled: true

# Process Management
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# Logging Settings
systemLog:
  destination: file
  path: ./logs/mongod.log
  logAppend: true
  level: info

# Security Settings (disabled for development)
# security:
#   authorization: enabled

# Development Note:
# For production, uncomment security settings and configure:
# - User authentication
# - Role-based access control (RBAC)
# - SSL/TLS encryption
